<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de alertas - PIXQUI</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#eef8ee;
    color:#333;
}

header{
    background:#3b8c5a;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

.contenedor{
    width:85%;
    max-width:1000px;
    margin:30px auto;
}

.contador{
    background:#3b8c5a;
    color:white;
    width:300px;
    max-width:90%;
    margin:20px auto;
    text-align:center;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 10px gray;
}

.contador h2{
    font-size:45px;
    margin:10px 0;
}

.formulario{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px gray;
    margin-bottom:30px;
}

.formulario h2{
    color:#25633d;
    margin-top:0;
}

.formulario input,
.formulario textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #aaa;
    box-sizing:border-box;
    font-size:15px;
}

.formulario textarea{
    height:80px;
    resize:vertical;
}

.formulario button{
    background:#3b8c5a;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.formulario button:hover{
    background:#25633d;
}

.lista{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    margin-top:20px;
}

.alerta{
    background:#d8f3dc;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 8px gray;
}

.alerta h3{
    margin-top:0;
    color:#25633d;
}

.alerta p{
    margin:8px 0;
}

.alerta button{
    background:#c0392b;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

.alerta button:hover{
    background:#962d22;
}

.vacio{
    text-align:center;
    color:#666;
    font-style:italic;
    margin-top:20px;
}

.botones{
    text-align:center;
    margin-top:30px;
    padding-bottom:30px;
}

.botones a{
    display:inline-block;
    margin:8px;
    padding:12px 25px;
    background:#3b8c5a;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.botones a:hover{
    background:#25633d;
}

</style>

</head>

<body>

<header>

<h1>Registro de alertas</h1>

</header>

<div class="contenedor">

<!-- CONTADOR -->

<div class="contador">

<p>Alertas este mes</p>

<h2 id="contador">0</h2>

<p>eventos registrados</p>

</div>

<!-- FORMULARIO -->

<div class="formulario">

<h2>Nueva alerta</h2>

<input
type="text"
id="nombre"
placeholder="Nombre del niño"

>

<input
type="date"
id="fecha"

>

<input
type="time"
id="hora"

>

<textarea
    id="observacion"
    placeholder="Observación"
></textarea>

<button onclick="guardarAlerta()">
    Guardar alerta
</button>

</div>

<!-- HISTORIAL -->

<h2>Historial de alertas</h2>

<div
    id="listaAlertas"
    class="lista"
></div>

<p
    id="mensajeVacio"
    class="vacio"
>
    No hay alertas registradas.
</p>

<!-- BOTÓN REGRESAR -->

<div class="botones">

<a href="panel.html">
    ⬅ Regresar al panel
</a>

</div>

</div>

<script type="module">


import { auth, db }
from "./js/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


let usuarioActual = null;

let rutaAlertas = null;


/* ========================================
   COMPROBAR SESIÓN
======================================== */


onAuthStateChanged(auth, async (usuario) => {


    console.log(
        "REGISTRO - Usuario Firebase:",
        usuario
    );


    if (!usuario) {


        console.log(
            "REGISTRO - Firebase todavía no detecta la sesión."
        );


        /*
            IMPORTANTE:
            No mandamos al login.
            Dejamos la página abierta para comprobar
            qué está ocurriendo con Firebase.
        */


        return;

    }


    console.log(
        "REGISTRO - Sesión correcta:",
        usuario.uid
    );


    usuarioActual = usuario.uid;


    rutaAlertas = collection(
        db,
        "usuarios",
        usuarioActual,
        "alertas"
    );


    await mostrarAlertas();


});



/* ========================================
   GUARDAR ALERTA
======================================== */


window.guardarAlerta = async function(){


    if (!rutaAlertas) {


        alert(
            "Espera un momento mientras se conecta la cuenta."
        );


        return;

    }


    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    const fecha =
        document.getElementById(
            "fecha"
        ).value;


    const hora =
        document.getElementById(
            "hora"
        ).value;


    const observacion =
        document.getElementById(
            "observacion"
        ).value.trim();



    if(
        nombre === "" ||
        fecha === "" ||
        hora === ""
    ){


        alert(
            "Completa nombre, fecha y hora."
        );


        return;

    }


    try{


        await addDoc(
            rutaAlertas,
            {

                nombre: nombre,

                fecha: fecha,

                hora: hora,

                observacion: observacion,

                distancia: "Pendiente"

            }
        );


        alert(
            "Alerta registrada correctamente."
        );


        document.getElementById(
            "nombre"
        ).value = "";


        document.getElementById(
            "fecha"
        ).value = "";


        document.getElementById(
            "hora"
        ).value = "";


        document.getElementById(
            "observacion"
        ).value = "";


        await mostrarAlertas();


    }


    catch(error){


        console.error(
            "Error al guardar alerta:",
            error
        );


        alert(
            "No se pudo guardar la alerta. Revisa la conexión con Firebase."
        );


    }


};



/* ========================================
   MOSTRAR ALERTAS
======================================== */


async function mostrarAlertas(){


    if(!rutaAlertas){

        return;

    }


    const lista =
        document.getElementById(
            "listaAlertas"
        );


    const mensaje =
        document.getElementById(
            "mensajeVacio"
        );


    lista.innerHTML = "";


    try{


        const datos =
            await getDocs(
                rutaAlertas
            );


        if(datos.empty){


            mensaje.style.display =
                "block";


            document.getElementById(
                "contador"
            ).textContent = "0";


            return;

        }


        mensaje.style.display =
            "none";


        let contador = 0;


        datos.forEach(
            (elemento) => {


                const alerta =
                    elemento.data();


                contador++;


                const tarjeta =
                    document.createElement(
                        "div"
                    );


                tarjeta.className =
                    "alerta";


                tarjeta.innerHTML = `

                    <h3>
                        ${alerta.fecha}
                    </h3>

                    <p>
                        <strong>Niño:</strong>
                        ${alerta.nombre}
                    </p>

                    <p>
                        <strong>Hora:</strong>
                        ${alerta.hora}
                    </p>

                    <p>
                        ${alerta.observacion || ""}
                    </p>

                    <p>
                        <strong>Distancia:</strong>
                        ${alerta.distancia || "Pendiente"}
                    </p>

                    <button
                        onclick="eliminarAlerta('${elemento.id}')"
                    >
                        Eliminar
                    </button>

                `;


                lista.appendChild(
                    tarjeta
                );


            }
        );


        document.getElementById(
            "contador"
        ).textContent =
            contador;


    }


    catch(error){


        console.error(
            "Error al cargar alertas:",
            error
        );


        mensaje.textContent =
            "No se pudieron cargar las alertas.";


        mensaje.style.display =
            "block";


    }


};



/* ========================================
   ELIMINAR ALERTA
======================================== */


window.eliminarAlerta = async function(id){


    if(
        confirm(
            "¿Deseas eliminar esta alerta?"
        )
    ){


        try{


            await deleteDoc(
                doc(
                    db,
                    "usuarios",
                    usuarioActual,
                    "alertas",
                    id
                )
            );


            await mostrarAlertas();


        }


        catch(error){


            console.error(
                "Error al eliminar:",
                error
            );


            alert(
                "No se pudo eliminar la alerta."
            );


        }


    }


};


</script>

</body>

</html>
