<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>



<body class="bg-[#F6EFD9]">



<!-- NAVBAR -->

<nav class="bg-[#F6EFD9] border-b border-[#E8DDB8]">

<div class="max-w-6xl mx-auto px-5 py-4 flex flex-col md:flex-row justify-between items-center gap-5">


<div class="flex items-center gap-3">

<img src="./imagenes/Logo.jpg"
class="w-14 h-14 rounded-full object-cover">


<h1 class="text-3xl font-bold">
PIXQUI
</h1>

</div>



<div class="flex flex-wrap justify-center gap-5 font-medium">


<a href="index.html" class="hover:text-[#8EC5FC]">
Inicio
</a>


<a href="nosotros.html" class="hover:text-[#8EC5FC]">
Nosotros

<a href="producto.html" class="hover:text-[#8EC5FC]">
Producto

Registro
</a>


<a href="contacto.html" class="hover:text-[#8EC5FC]">

</a>


</div>


</div>

</nav>







<section class="max-w-6xl mx-auto px-6 py-12">





<h1 class="text-4xl font-bold text-center text-[#26758c] mb-10">

Registro de alertas

</h1>






<!-- CONTADOR -->

<div class="bg-[#26758c] text-white rounded-3xl shadow-lg p-6 max-w-xs mx-auto text-center">


<p>
Alertas este mes
</p>


<h2 id="contador" class="text-5xl font-bold my-3">
0
</h2>


<p>
eventos registrados
</p>


</div>








<!-- FORMULARIO -->


<div class="bg-white rounded-2xl shadow-lg p-8 mt-10">


<h2 class="text-2xl font-bold text-[#26758c] mb-5">

Nueva alerta

</h2>




<input id="nombre"
type="text"
placeholder="Nombre del niño"
class="w-full p-3 mb-4 border rounded-lg">



<input id="fecha"
type="date"
class="w-full p-3 mb-4 border rounded-lg">



<input id="hora"
type="time"
class="w-full p-3 mb-4 border rounded-lg">



<textarea id="observacion"
placeholder="Observación"
class="w-full p-3 mb-4 border rounded-lg h-24"></textarea>




<button onclick="guardarAlerta()"

class="bg-[#26758c] text-white px-7 py-3 rounded-full hover:bg-[#155263]">

Guardar alerta

</button>


</div>







<h2 class="text-3xl font-bold text-[#26758c] mt-12 mb-6">

Historial de alertas

</h2>




<div id="listaAlertas"
class="grid md:grid-cols-3 gap-6">

</div>



<p id="mensajeVacio"
class="text-center text-gray-600 italic mt-5">

No hay alertas registradas.

</p>





<div class="text-center mt-10">


<a href="panel.html"

class="bg-[#26758c] text-white px-7 py-3 rounded-full">

⬅ Regresar al panel

</a>


</div>



</section>







<script>


const madre = localStorage.getItem('madre');


if(!madre){

window.location.href='login.html';

}



const claveAlertas = 'alertas_' + madre;



mostrarAlertas();




function guardarAlerta(){


const nombre=document.getElementById('nombre').value.trim();

const fecha=document.getElementById('fecha').value;

const hora=document.getElementById('hora').value;

const observacion=document.getElementById('observacion').value.trim();



if(nombre==='' || fecha==='' || hora===''){

alert('Completa nombre, fecha y hora.');

return;

}



const alerta={

nombre,

fecha,

hora,

observacion

};



let alertas=JSON.parse(localStorage.getItem(claveAlertas)) || [];

alertas.push(alerta);



localStorage.setItem(claveAlertas,JSON.stringify(alertas));



document.getElementById('nombre').value='';

document.getElementById('fecha').value='';

document.getElementById('hora').value='';

document.getElementById('observacion').value='';



mostrarAlertas();


}


function mostrarAlertas(){


const lista=document.getElementById('listaAlertas');

const mensaje=document.getElementById('mensajeVacio');


let alertas=JSON.parse(localStorage.getItem(claveAlertas)) || [];


lista.innerHTML='';


let contadorMensual=0;


const hoy=new Date();

const mesActual=hoy.getMonth()+1;

const anioActual=hoy.getFullYear();




if(alertas.length===0){

mensaje.style.display='block';

}else{

mensaje.style.display='none';

}


alertas.forEach((alerta,index)=>{


const partes=alerta.fecha.split('-');

const anio=parseInt(partes[0]);

const mes=parseInt(partes[1]);



if(mes===mesActual && anio===anioActual){

contadorMensual++;

}



const tarjeta=document.createElement('div');


tarjeta.className="bg-[#bfe8f5] rounded-2xl shadow-lg p-5";


tarjeta.innerHTML=`

<h3 class="text-xl font-bold text-[#155263]">

${alerta.fecha}

</h3>


<p><strong>Niño:</strong> ${alerta.nombre}</p>

<p><strong>Hora:</strong> ${alerta.hora}</p>

<p>${alerta.observacion}</p>


<button onclick="eliminarAlerta(${index})"

class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg">

Eliminar

</button>

`;



lista.appendChild(tarjeta);



});



document.getElementById('contador').textContent=contadorMensual;



}







function eliminarAlerta(index){


if(confirm('¿Deseas eliminar esta alerta?')){


let alertas=JSON.parse(localStorage.getItem(claveAlertas)) || [];


alertas.splice(index,1);


localStorage.setItem(claveAlertas,JSON.stringify(alertas));


mostrarAlertas();


}


}


</script>


</body>

</html>
