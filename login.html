<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar sesión PIXQUI</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#F6EFD9]">





<!-- NAVBAR -->

<nav class="bg-[#F6EFD9] border-b border-[#E8DDB8]">

<div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center">


<div class="flex items-center gap-3">


<img src="./imagenes/Logo.jpg"
alt="Logo PIXQUI"
class="w-14 h-14 rounded-full object-cover">


<h1 class="text-3xl font-bold">
PIXQUI
</h1>


</div>


</div>

</nav>







<section class="max-w-6xl mx-auto px-6 py-16">





<div class="bg-white max-w-md mx-auto rounded-2xl shadow-lg p-8 text-center">



<h1 class="text-4xl font-bold text-[#26758c] mb-2">

PIXQUI

</h1>



<p class="text-gray-600 mb-8">

Inicio de sesión

</p>





<h2 class="text-2xl font-bold mb-5">

Ingresar

</h2>







<input id="nombre"

type="text"

placeholder="Nombre del cuidador"

class="w-full p-3 mb-4 border rounded-lg">





<input id="nino"

type="text"

placeholder="Nombre del niño"

class="w-full p-3 mb-6 border rounded-lg">







<button onclick="entrar()"

class="bg-[#26758c] text-white px-8 py-3 rounded-full hover:bg-[#155263]">

Ingresar

</button>





</div>







<div class="text-center mt-8">


<a href="index.html"

class="text-[#26758c] font-medium">

Volver al inicio

</a>


</div>






</section>








<script>


function entrar(){


let nombre = document.getElementById("nombre").value;


let nino = document.getElementById("nino").value;



if(nombre=="" || nino==""){


alert("Completa los datos");


return;


}





localStorage.setItem("madre",nombre);


localStorage.setItem("nino",nino);



window.location.href="panel.html";



}



</script>





</body>

</html>
