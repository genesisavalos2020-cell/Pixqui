<!DOCTYPE html>
<html>

<head>

<title>Iniciar sesión PIXQUI</title>


<style>

body{

font-family:Arial,sans-serif;
margin:0;
background:#f7f3ee;
color:#333;

}


header{

background:#26758c;
padding:20px;
text-align:center;
color:white;

}


header h1{

margin:0;

}



.contenido{

padding:40px;
text-align:center;

}



.login{

background:white;
width:350px;
margin:40px auto;
padding:30px;
border-radius:15px;
box-shadow:0px 4px 10px gray;

}



input{

width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:1px solid #aaa;

}



button{

background:#26758c;
color:white;
padding:12px 30px;
border:none;
border-radius:8px;
cursor:pointer;

}



button:hover{

background:#155263;

}



a{

display:inline-block;
margin-top:25px;
color:#26758c;
text-decoration:none;

}



</style>


</head>



<body>


<header>

<h1>
PIXQUI
</h1>

<p>
Inicio de sesión
</p>

</header>





<div class="contenido">



<div class="login">


<h2>
Ingresar
</h2>



<input id="nombre" type="text" placeholder="Nombre de madre">



<input id="nino" type="text" placeholder="Nombre del niño">



<button onclick="entrar()">

Ingresar

</button>




</div>



<a href="index.html">
Volver al inicio
</a>



</div>





<script>


function entrar(){


let nombre =
document.getElementById("nombre").value;


let nino =
document.getElementById("nino").value;



if(nombre=="" || nino==""){

alert("Completa los datos");

return;

}




localStorage.setItem("madre",nombre);

localStorage.setItem("nino",nino);



window.location.href="panel.html";



}


</script>



</body>

</html>
