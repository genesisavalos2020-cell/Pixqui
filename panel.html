<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel PIXQUI</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#F6EFD9]">



<!-- NAVBAR -->

<nav class="bg-[#F6EFD9] border-b border-[#E8DDB8]">


<div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center">


<div class="flex items-center gap-3">


<img src="./imagenes/Logo.jpg"
alt="Logo PIXQUI"
class="w-14 h-14 rounded-full object-cover">


<h1 class="text-3xl font-bold">
PIXQUI
</h1>


</div>


</div>


</nav>



<section class="max-w-6xl mx-auto px-6 py-12">




<h1 class="text-4xl font-bold text-center text-[#26758c] mb-10">

Panel de control PIXQUI

</h1>




<!-- BIENVENIDA -->

<div class="bg-white rounded-2xl shadow-lg p-8 text-center">


<h2 id="saludo"
class="text-3xl font-bold text-[#26758c]">

</h2>


<p class="text-gray-700 mt-3">

Este es tu panel privado de seguimiento.

</p>


</div>




<!-- TARJETAS -->

<div class="grid md:grid-cols-3 gap-8 mt-10">



<div class="bg-[#bfe8f5] rounded-2xl shadow-lg p-6 text-center">


<h2 class="text-xl font-bold text-[#155263]">

Niño registrado

</h2>


<p id="nombreNino"
class="mt-4 text-lg">

</p>


</div>




<div class="bg-[#bfe8f5] rounded-2xl shadow-lg p-6 text-center">


<h2 class="text-xl font-bold text-[#155263]">

Alertas este mes

</h2>


<h1 id="contador"
class="text-5xl font-bold text-[#26758c] mt-3">

0

</h1>


</div>







<div class="bg-[#bfe8f5] rounded-2xl shadow-lg p-6 text-center">


<h2 class="text-xl font-bold text-[#155263]">

Estado

</h2>


<p class="mt-4">

🟢 Monitoreo activo

</p>


</div>



</div>



<div class="text-center mt-12">


<a href="registro.html"

class="bg-[#26758c] text-white px-7 py-3 rounded-full hover:bg-[#155263]">

Ver registro de alertas

</a>





<button onclick="cerrarSesion()"

class="bg-red-500 text-white px-7 py-3 rounded-full ml-3 hover:bg-red-600">

Cerrar sesión

</button>


</div>






</section>









<script>


const madre = localStorage.getItem('madre');

const nino = localStorage.getItem('nino');




if(!madre || !nino){

window.location.href="login.html";

}


document.getElementById('saludo').textContent =
"Bienvenida, " + madre + " 👋";



document.getElementById('nombreNino').textContent=nino;



const claveAlertas="alertas_"+madre;


const alertas =
JSON.parse(localStorage.getItem(claveAlertas)) || [];




const hoy=new Date();

const mesActual=hoy.getMonth()+1;

const anioActual=hoy.getFullYear();



let contadorMensual=0;




alertas.forEach(alerta=>{


const partes=alerta.fecha.split('-');


const anio=parseInt(partes[0]);

const mes=parseInt(partes[1]);



if(mes===mesActual && anio===anioActual){

contadorMensual++;

}


});


document.getElementById('contador').textContent=contadorMensual;

function cerrarSesion(){

localStorage.removeItem('madre');

localStorage.removeItem('nino');


window.location.href="index.html";


}

</script>


</body>

</html>
